<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV Drop et Estimation</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
  }

  .drop-box, .result-box {
    width: 400px;
    min-height: 150px;
    border: 2px dashed #888;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    margin-bottom: 20px;
    background-color: #fff;
    transition: background-color 0.3s, border-color 0.3s;
  }

  .drop-box.dragover {
    background-color: #e0f7fa;
    border-color: #26c6da;
  }

  .result-box {
    flex-direction: column;
    align-items: flex-start;
    min-height: 120px;
    padding: 10px;
    font-size: 16px;
  }
</style>
</head>
<body>

<div class="drop-box" id="drop-box">
  Deposer votre CSV
</div>

<div class="result-box" id="result-box">
  Whishlist : ...<br>
  Gold : ...<br>
  Total cartes : ...
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
  // === Fonctions pour calculer la valeur des cartes ===
  function determinePrintType(printNumber) {
      if (printNumber >= 1 && printNumber <= 10) return "Special Print";
      else if (printNumber >= 11 && printNumber <= 100) return "Light Print";
      else if (printNumber >= 101 && printNumber <= 1000) return "Mid Print";
      else return "High Print";
  }

  function estimateTicketValue(edition, printType, wl) {
      let minValue = 0, maxValue = 0;

      if (edition === 1) {
          if (printType === "Special Print") { minValue=2; maxValue=4; }
          else if (printType === "Light Print") { minValue=8; maxValue=14; }
          else if (printType === "Mid Print") { minValue=70; maxValue=100; }
          else if (printType === "High Print") { minValue=750; maxValue=950; }
      } else if (edition === 2) {
          if (printType === "Special Print") { minValue=2; maxValue=4; }
          else if (printType === "Light Print") { minValue=8.2; maxValue=15.2; }
          else if (printType === "Mid Print") { minValue=65; maxValue=95; }
          else if (printType === "High Print") { minValue=720; maxValue=840; }
      } else if (edition === 3) {
          if (printType === "Special Print") { minValue=2; maxValue=4; }
          else if (printType === "Light Print") { minValue=8; maxValue=15; }
          else if (printType === "Mid Print") { minValue=60; maxValue=90; }
          else if (printType === "High Print") { minValue=590; maxValue=700; }
      } else if (edition === 4) {
          if (printType === "Special Print") { minValue=2; maxValue=4; }
          else if (printType === "Light Print") { minValue=7; maxValue=13; }
          else if (printType === "Mid Print") { minValue=55; maxValue=85; }
          else if (printType === "High Print") { minValue=380; maxValue=470; }
      } else if (edition === 5) {
          if (printType === "Special Print") { minValue=2; maxValue=4; }
          else if (printType === "Light Print") { minValue=8.1; maxValue=12.1; }
          else if (printType === "Mid Print") { minValue=65; maxValue=80; }
          else if (printType === "High Print") { minValue=200; maxValue=240; }
      } else if (edition === 6) {
          if (printType === "Special Print") { minValue=2; maxValue=4; }
          else if (printType === "Light Print") { minValue=8; maxValue=11; }
          else if (printType === "Mid Print") { minValue=55; maxValue=70; }
          else if (printType === "High Print") { minValue=190; maxValue=220; }
      } else if (edition === 7) {
          if (printType === "Special Print") { minValue=2; maxValue=4; }
          else if (printType === "Light Print") { minValue=9; maxValue=12; }
          else if (printType === "Mid Print") { minValue=50; maxValue=65; }
          else if (printType === "High Print") { minValue=140; maxValue=180; }
      }

      if (minValue === 0 && maxValue === 0) return 0;

      const avgValue = (minValue + maxValue) / 2;
      return wl / avgValue;
  }

  // === Gestion du drop ===
  const dropBox = document.getElementById('drop-box');
  const resultBox = document.getElementById('result-box');

  dropBox.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropBox.classList.add('dragover');
  });

  dropBox.addEventListener('dragleave', () => {
      dropBox.classList.remove('dragover');
  });

  dropBox.addEventListener('drop', (e) => {
      e.preventDefault();
      dropBox.classList.remove('dragover');

      const file = e.dataTransfer.files[0];
      if (file && file.type === "text/csv") {
          const reader = new FileReader();
          reader.onload = function(event) {
              const csvData = event.target.result;

              Papa.parse(csvData, {
                  header: false,
                  skipEmptyLines: true,
                  complete: function(results) {
                      let wishlistSum = 0;
                      let goldSum = 0;
                      let totalCardValue = 0;

                      results.data.forEach(row => {
                          const number = parseInt(row[1]) || 0;
                          const edition = parseInt(row[2]) || 0;
                          const wl = parseFloat(row[16]) || 0;
                          const burnValue = parseFloat(row[8]) || 0;

                          wishlistSum += wl;
                          goldSum += burnValue;

                          const printType = determinePrintType(number);
                          totalCardValue += estimateTicketValue(edition, printType, wl);
                      });

                      resultBox.innerHTML = `
                          Whishlist : ${wishlistSum}<br>
                          Gold : ${goldSum}<br>
                          Total cartes : ${totalCardValue.toFixed(2)}
                      `;
                  }
              });
          };
          reader.readAsText(file);
      } else {
          alert("Veuillez déposer un fichier CSV valide !");
      }
  });
</script>

</body>
</html>
