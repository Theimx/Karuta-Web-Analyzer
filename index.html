<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon site</title>
    <link rel="stylesheet" href="style.css"> <!-- Lien vers CSS -->
</head>
<body>
    <header>
        <h1>Karuta Web Analyser</h1>
    </header>

    <main>
        <p>Uploadez votre collection pour récupérer les stats</p>      
        <div class="controle">
            <!-- Colonne gauche : Bouton 1 -->
            
            <button id="monBouton">Action</button>
            
        
            <!-- Colonne droite : Bouton 2 remplacé par curseur -->
            <div class="bloc-droite">
                <button id="secondBouton">Autre action</button> <!-- Optionnel : tu peux le retirer -->
                <div class="curseur-blanc">
                    <p class="description-curseur">Réglez la valeur :</p>
                    <input type="range" id="monCurseur" min="0" max="100" value="50">
                    <span id="valeurAffichee">50</span>
                </div>
            </div>
        </div>
        
        
        
        <p id="message">Ceci est un texte.</p>
        
    </main>

    <script src="script.js"></script> <!-- Lien vers JS -->
</body>
</html>
