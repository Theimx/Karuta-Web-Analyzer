<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CSV Drag & Drop Viewer</title>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 40px;
  background-color: #f5f5f5;
}

.container {
  max-width: 800px;
  margin: auto;
}

/* Boîte de code */
.code-box {
  position: relative;
  margin: 20px 0;
  max-width: 600px;
  width: 100%;
}

.code-box pre {
  background-color: #0d1117;
  color: #c9d1d9;
  padding: 16px;
  border-radius: 8px;
  overflow: auto;
  font-family: Consolas, Monaco, monospace;
  font-size: 14px;
  border: 2px solid #30363d;
  box-sizing: border-box;
  min-height: 120px;
}

/* Zone de drop */
.drop-zone {
  border: 2px dashed #FF4C4C;
  text-align: center;
  cursor: pointer;
}

.drop-zone.dragover {
  background-color: #161b22;
  border-color: #2ea043;
}

/* Bouton */
button {
  background-color: #FF4C4C;
  color: white;
  border: none;
  border-radius: 4px;
  padding: 6px 12px;
  cursor: pointer;
}

button:hover {
  background-color: #e04343;
}
</style>
</head>

<body>
<div class="container">

  <h2>1️⃣ Exemple de boîte de code</h2>
  <div class="code-box">
    <pre><code>const x = 42;
console.log(x);</code></pre>
  </div>

  <h2>2️⃣ Dépose ton fichier CSV ci-dessous</h2>

  <div class="code-box">
    <pre id="csvOutput" class="drop-zone">
Glisse et dépose un fichier CSV ici
ou clique pour en sélectionner un
    </pre>
  </div>

  <input type="file" id="csvInput" accept=".csv" hidden>

</div>

<script>
const dropZone = document.getElementById("csvOutput");
const fileInput = document.getElementById("csvInput");

/* Click = ouvrir le sélecteur */
dropZone.addEventListener("click", () => fileInput.click());

/* Drag & drop */
dropZone.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", () => {
  dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.classList.remove("dragover");

  const file = e.dataTransfer.files[0];
  if (file) loadCSV(file);
});

/* Sélection via input */
fileInput.addEventListener("change", () => {
  if (fileInput.files[0]) loadCSV(fileInput.files[0]);
});

/* Lecture du CSV */
function loadCSV(file) {
  if (!file.name.endsWith(".csv")) {
    dropZone.textContent = "❌ Veuillez déposer un fichier CSV valide.";
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    dropZone.textContent = e.target.result;
  };
  reader.readAsText(file);
}
</script>

</body>
</html>
